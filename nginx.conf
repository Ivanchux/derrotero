server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  location / { try_files $uri $uri/ =404; add_header X-Content-Type-Options nosniff; }
  location ~* \.(woff2|png)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  location ~* \.(js|css)$ { expires 1h; }
  # Los mapas exportados (.html) se pueden incrustar desde cualquier web
  location ~* \.html$ { add_header Cache-Control "no-cache"; }
}
